services:
  backend:
    build: ./backend
    environment:
      - DATABASE_URL=file:./prisma/dev.db
      - JWT_SECRET=change_this_to_a_random_secret_key
      - PORT=3000
    volumes:
      - db-data:/app/prisma
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8085:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
